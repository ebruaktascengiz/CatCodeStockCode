<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGPS Yardımcı Asistan</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        #open-chat-btn { position: fixed; bottom: 20px; right: 20px; background-color: #003366; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 2em; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
        #open-chat-btn:hover { transform: scale(1.1); }
        .chat-popup { display: none; position: fixed; bottom: 20px; right: 20px; width: 370px; max-height: 85vh; background-color: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.25); flex-direction: column; overflow: hidden; border: 1px solid #ddd; }
        .chat-header { background-color: #003366; color: white; padding: 15px 20px; text-align: center; font-size: 1.2em; font-weight: bold; }
        #user-info-form { padding: 20px; background-color: #f9f9f9; }
        #user-info-form p { text-align: center; margin-top: 0; margin-bottom: 15px; color: #555; }
        #user-info-form input { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #user-info-form button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; }
        #user-info-form button:hover { background-color: #218838; }
        .chat-container { display: none; flex-direction: column; height: 450px; }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; background-color: #f9f9f9; display: flex; flex-direction: column; }
        .message { margin-bottom: 12px; padding: 10px 15px; border-radius: 18px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background-color: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background-color: #e9e9eb; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid #ddd; background-color: #fff; }
        #userInput { flex-grow: 1; border: 1px solid #ccc; border-radius: 20px; padding: 10px 15px; font-size: 1em; }
        #userInput:focus { outline: none; border-color: #003366; }
        #sendBtn { background-color: #003366; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 10px; cursor: pointer; font-size: 1.5em; line-height: 40px; text-align: center; transition: background-color 0.2s; }
        #sendBtn:hover { background-color: #0055a4; }
    </style>
</head>
<body>

<button id="open-chat-btn">💬</button>

<div class="chat-popup" id="chat-window">
    <div class="chat-header">EGPS Yardımcı Asistan</div>

    <div id="user-info-form">
        <p>Görüşmeye başlamak için lütfen bilgilerinizi girin.</p>
        <input type="text" id="userName" placeholder="İsim" required>
        <input type="email" id="userEmail" placeholder="E-posta Adresi" required>
        <input type="text" id="projectCode" placeholder="Proje Kodu" required>
        <button id="startChatBtn">Sohbeti Başlat</button>
    </div>

    <div class="chat-container" id="chat-container">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Sorunuzu buraya yazın...">
            <button id="sendBtn">→</button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const openChatBtn = document.getElementById('open-chat-btn');
    const startChatBtn = document.getElementById('startChatBtn');
    const userInfoForm = document.getElementById('user-info-form');
    const chatContainer = document.getElementById('chat-container');
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let sessionId = null;
    let userInfo = {};

    openChatBtn.addEventListener('click', () => {
        chatWindow.style.display = 'flex';
        openChatBtn.style.display = 'none';
    });

    startChatBtn.addEventListener('click', async () => {
        const name = document.getElementById('userName').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const projectCode = document.getElementById('projectCode').value.trim();

        if (name && email && projectCode) {
            userInfo = { name, email, projectCode };

            try {
                const response = await fetch('/start_chat', { method: 'POST' });
                const data = await response.json();
                sessionId = data.sessionId;

                userInfoForm.style.display = 'none';
                chatContainer.style.display = 'flex';

                addMessage('Merhaba! Ben EGPS asistanı. Satınalma sistemiyle ilgili size nasıl yardımcı olabilirim?', 'bot');

            } catch (error) {
                console.error('Sohbet başlatılırken hata:', error);
                alert('Sohbet başlatılırken bir sunucu hatası oluştu. Lütfen daha sonra tekrar deneyin.');
            }
        } else {
            alert('Lütfen tüm alanları doldurun.');
        }
    });

    async function sendMessage() {
        const messageText = userInput.value.trim();
        if (messageText === '' || !sessionId) return;
        addMessage(messageText, 'user');
        userInput.value = '';
        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText, sessionId: sessionId, userInfo: userInfo })
            });
            if (!response.ok) { throw new Error('Sunucu yanıtı başarısız.'); }
            const data = await response.json();
            addMessage(data.response, 'bot');
        } catch (error) {
            console.error('Mesaj gönderilirken hata:', error);
            addMessage('Üzgünüm, bir hata oluştu. Lütfen bağlantınızı kontrol edip tekrar deneyin.', 'bot');
        }
    }

    function addMessage(text, sender) {
        const messageElement = document.createElement('div');
        messageElement.classList.add('message', sender);
        messageElement.textContent = text;
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { sendMessage(); } });

    document.addEventListener('click', (event) => {
        if (!chatWindow.contains(event.target) && !openChatBtn.contains(event.target)) {
            chatWindow.style.display = 'none';
            openChatBtn.style.display = 'block';
        }
    });
</script>

</body>
</html>
